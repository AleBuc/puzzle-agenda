# Local development database. Credentials match
# backend/bootstrap/src/main/resources/application.yml; never reuse them
# outside a developer machine. For self-hosting the app, see the Docker
# Compose example in README.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: puzzle_agenda
      POSTGRES_USER: puzzle_agenda
      POSTGRES_PASSWORD: puzzle_agenda
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puzzle_agenda -d puzzle_agenda"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
